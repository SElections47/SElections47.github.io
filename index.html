<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D474 // OFFICIAL STORE // DATA THE DESTROYER</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #050508;
            --panel-bg: rgba(15, 15, 25, 0.7);
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff0055;
            --accent-gold: #ffcc00;
            --text-main: #f0f0f8;
            --text-dim: #8a8aa3;
            --border-glow: rgba(0, 243, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, #050508 0%, #0a0a12 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* --- Header / Hero --- */
        header {
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            background: rgba(5, 5, 8, 0.8);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-cyan), #ffffff, var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .brand-subtitle {
            font-size: 1rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin-top: 0.5rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- Floating Admin Bar --- */
        .admin-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 10, 18, 0.9);
            border: 1px solid var(--accent-cyan);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            backdrop-filter: blur(10px);
        }

        .btn-toggle {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-speed);
        }

        .btn-toggle:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--accent-cyan);
        }

        /* --- Store Container --- */
        .container {
            max-width: 1300px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* --- Avant-Garde Product Card --- */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.15), 0 0 15px rgba(255, 0, 85, 0.1);
        }

        .card-img-wrap {
            width: 100%;
            height: 220px;
            background: #10101a;
            position: relative;
            overflow: hidden;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.08);
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-cyan), #00a2ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 1px;
            transition: var(--transition-speed);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-buy:hover {
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transform: scale(1.02);
        }

        .card-admin-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 8px;
            z-index: 10;
        }

        body.admin-active .card-admin-actions {
            display: flex;
        }

        .btn-admin-icon {
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-speed);
        }

        .btn-admin-icon:hover {
            background: var(--accent-magenta);
            border-color: var(--accent-magenta);
        }

        /* --- Admin Drawer Overlay --- */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--accent-cyan);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 1001;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 2rem;
            overflow-y: auto;
        }

        .admin-panel.open {
            right: 0;
        }

        .admin-panel h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: var(--transition-speed);
        }

        .form-control:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0,243,255,0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition-speed);
        }

        .btn-action:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .fetch-status {
            font-size: 0.8rem;
            margin-top: 0.4rem;
            color: var(--accent-gold);
            display: none;
        }

        /* Glitch effect on header */
        .glitch-sub {
            color: var(--accent-magenta);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; text-shadow: 0 0 10px var(--accent-magenta); }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1 class="brand-title">D474 Store</h1>
        <p class="brand-subtitle">Data The Destroyer <span class="glitch-sub">//</span> DJ D474 The Rapper</p>
    </header>

    <!-- Product Grid -->
    <main class="container">
        <div id="product-grid" class="grid">
            <!-- Dynamic MagicLink Products Render Here -->
        </div>
    </main>

    <!-- Floating Admin Bar -->
    <div class="admin-bar">
        <button class="btn-toggle" id="admin-toggle-btn" onclick="toggleAdminMode()">
            <i class="fa-solid fa-user-gear"></i> <span id="admin-status">Admin Off</span>
        </button>
        <button class="btn-toggle" id="open-panel-btn" onclick="openAdminPanel()" style="display:none;">
            <i class="fa-solid fa-plus"></i> Add Link
        </button>
        <button class="btn-toggle" id="export-btn" onclick="exportConfig()" style="display:none;">
            <i class="fa-solid fa-download"></i> Export
        </button>
    </div>

    <!-- Admin Panel Drawer -->
    <div class="admin-panel" id="admin-panel">
        <h2>
            <span id="panel-title">Add MagicLink</span>
            <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeAdminPanel()"></i>
        </h2>
        <form id="product-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="prod-id">
            
            <div class="form-group">
                <label for="prod-link">MagicLink URL</label>
                <input type="url" id="prod-link" class="form-control" placeholder="https://buy.stripe.com/..." required onchange="autoFetchMetadata(this.value)">
                <div id="fetch-status" class="fetch-status"><i class="fa-solid fa-spinner fa-spin"></i> Fetching link metadata...</div>
            </div>

            <div class="form-group">
                <label for="prod-title">Product Title</label>
                <input type="text" id="prod-title" class="form-control" placeholder="Item Title" required>
            </div>

            <div class="form-group">
                <label for="prod-desc">Description</label>
                <textarea id="prod-desc" class="form-control" placeholder="Item details, track info, or merch spec..."></textarea>
            </div>

            <div class="form-group">
                <label for="prod-price">Price Display (e.g. $19.99)</label>
                <input type="text" id="prod-price" class="form-control" placeholder="$0.00" required>
            </div>

            <div class="form-group">
                <label for="prod-img">Image URL</label>
                <input type="url" id="prod-img" class="form-control" placeholder="https://...">
            </div>

            <button type="submit" class="btn-action">Save to Inventory</button>
            <button type="button" class="btn-action btn-secondary" onclick="closeAdminPanel()">Cancel</button>
        </form>
    </div>

    <script>
        // Default seed inventory in case local storage is empty
        const DEFAULT_INVENTORY = [
            {
                id: '1',
                link: 'https://buy.stripe.com/test_1',
                title: 'Data The Destroyer - Cyber Beats Vol 1',
                description: 'Exclusive digital LP download featuring underground synthwave tracks by DJ D474.',
                price: '$14.99',
                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: '2',
                link: 'https://buy.stripe.com/test_2',
                title: 'D474 Official Hologram Hoodie',
                description: 'Limited edition ultra-heavyweight cybernetic street apparel.',
                price: '$65.00',
                image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80'
            }
        ];

        let inventory = [];
        let isAdmin = false;

        // Initialize Store
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('d474_inventory');
            if (saved) {
                try { inventory = JSON.parse(saved); } catch(e) { inventory = DEFAULT_INVENTORY; }
            } else {
                inventory = DEFAULT_INVENTORY;
            }
            renderProducts();
        });

        // Save Store Data to LocalStorage
        function saveInventory() {
            localStorage.setItem('d474_inventory', JSON.stringify(inventory));
            renderProducts();
        }

        // Render Product Grid
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if(inventory.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 3rem;">Inventory empty. Toggle Admin Mode to add items.</div>`;
                return;
            }

            inventory.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-admin-actions">
                        <button class="btn-admin-icon" title="Edit" onclick="editProduct('${item.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-admin-icon" title="Delete" onclick="deleteProduct('${item.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="card-img-wrap">
                        <img src="${item.image || 'https://via.placeholder.com/600x400/10101a/00f3ff?text=D474+STORE'}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400/10101a/00f3ff?text=D474+STORE'">
                    </div>
                    <div class="card-body">
                        <div>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.description || ''}</p>
                        </div>
                        <div>
                            <div class="card-price">${item.price}</div>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-buy">
                                BUY NOW <i class="fa-solid fa-bolt" style="margin-left:6px;"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Toggle Admin Mode
        function toggleAdminMode() {
            isAdmin = !isAdmin;
            document.body.classList.toggle('admin-active', isAdmin);
            document.getElementById('admin-status').innerText = isAdmin ? 'Admin Active' : 'Admin Off';
            document.getElementById('open-panel-btn').style.display = isAdmin ? 'inline-flex' : 'none';
            document.getElementById('export-btn').style.display = isAdmin ? 'inline-flex' : 'none';
        }

        // Admin Panel Controls
        function openAdminPanel(editId = null) {
            const panel = document.getElementById('admin-panel');
            const form = document.getElementById('product-form');
            form.reset();
            
            if (editId) {
                const prod = inventory.find(i => i.id === editId);
                if (prod) {
                    document.getElementById('panel-title').innerText = 'Edit Item';
                    document.getElementById('prod-id').value = prod.id;
                    document.getElementById('prod-link').value = prod.link;
                    document.getElementById('prod-title').value = prod.title;
                    document.getElementById('prod-desc').value = prod.description;
                    document.getElementById('prod-price').value = prod.price;
                    document.getElementById('prod-img').value = prod.image;
                }
            } else {
                document.getElementById('panel-title').innerText = 'Add MagicLink';
                document.getElementById('prod-id').value = '';
            }
            panel.classList.add('open');
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').classList.remove('open');
        }

        // Auto Fetch Metadata from MagicLink URL
        async function autoFetchMetadata(url) {
            if(!url || !url.startsWith('http')) return;
            const statusEl = document.getElementById('fetch-status');
            statusEl.style.display = 'block';

            try {
                // Using AllOrigins CORS Proxy to fetch page HTML
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');

                    // Extract Open Graph or standard HTML tags
                    const ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title;
                    const ogDesc = doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content;
                    const ogImage = doc.querySelector('meta[property="og:image"]')?.content;

                    if (ogTitle && !document.getElementById('prod-title').value) {
                        document.getElementById('prod-title').value = ogTitle;
                    }
                    if (ogDesc && !document.getElementById('prod-desc').value) {
                        document.getElementById('prod-desc').value = ogDesc;
                    }
                    if (ogImage && !document.getElementById('prod-img').value) {
                        document.getElementById('prod-img').value = ogImage;
                    }
                }
            } catch (err) {
                console.warn('Metadata auto-fetch bypassed:', err);
            } finally {
                statusEl.style.display = 'none';
            }
        }

        // Form Submission
        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value || Date.now().toString();
            const newItem = {
                id: id,
                link: document.getElementById('prod-link').value,
                title: document.getElementById('prod-title').value,
                description: document.getElementById('prod-desc').value,
                price: document.getElementById('prod-price').value,
                image: document.getElementById('prod-img').value
            };

            const existingIndex = inventory.findIndex(i => i.id === id);
            if (existingIndex > -1) {
                inventory[existingIndex] = newItem;
            } else {
                inventory.unshift(newItem);
            }

            saveInventory();
            closeAdminPanel();
        }

        function editProduct(id) {
            openAdminPanel(id);
        }

        function deleteProduct(id) {
            if(confirm('Are you sure you want to remove this MagicLink item?')) {
                inventory = inventory.filter(i => i.id !== id);
                saveInventory();
            }
        }

        // Export Inventory to JSON for committing directly to repository source code
        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(inventory, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "d474_inventory.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
